[project]
name = "extractor-local-speech-windows"
version = "0.1.0"
description = "Optional offline Windows faster-whisper worker; CUDA runtime is an explicit extra"
requires-python = ">=3.12,<3.15"
dependencies = [
  "faster-whisper==1.2.1",
  "ctranslate2==4.8.3",
  # faster-whisper 1.2.1 passes metadata_errors to av.open; PyAV 19 removed it.
  "av>=11,<19",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
cuda = [
  "nvidia-cublas-cu12==12.9.2.10; sys_platform == 'win32' and platform_machine == 'AMD64'",
  "nvidia-cudnn-cu12==9.27.0.42; sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.uv]
package = false
